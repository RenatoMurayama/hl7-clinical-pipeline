version: 2

models:
  - name: stg_admissions
    description: "Inpatient admissions (HL7 ADT^A01), one row per admission."
    columns:
      - name: message_id
        data_tests: [unique, not_null]
      - name: visit_number
        data_tests: [unique]
      - name: patient_mrn
        data_tests: [not_null]
      - name: admitted_at
        data_tests: [not_null]

  - name: stg_appointments
    description: "Outpatient appointments (HL7 SIU^S12), one row per booking."
    columns:
      - name: appointment_id
        data_tests: [unique, not_null]
      - name: patient_mrn
        data_tests: [not_null]
      - name: appointment_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['Booked']

  - name: stg_lab_results
    description: "Lab results (HL7 ORU^R01), one row per OBX result, LOINC-coded."
    columns:
      - name: patient_mrn
        data_tests: [not_null]
      - name: loinc_code
        data_tests: [not_null]
      - name: abnormal_flag
        data_tests:
          - accepted_values:
              arguments:
                values: ['H', 'L', 'N']
      - name: result_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['F']
      - name: result_value
        description: "Numeric result. NULL when the lab did not send a valid value."
        data_tests:
          - not_null:
              config:
                severity: warn