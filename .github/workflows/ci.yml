name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    # A throwaway PostgreSQL, created for this run and destroyed afterwards
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinical
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: clinical_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinical -d clinical_dw"
          --health-interval 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: clinical
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: clinical_dw

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -v

      - name: Generate synthetic HL7 messages
        run: python src/generate_hl7.py

      - name: Ingest into raw layer
        run: python src/ingest_hl7.py

      - name: Build and test dbt models
        working-directory: dbt
        run: dbt build